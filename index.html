<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanishq · Diamond Earrings Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }
</script>
</head>
<body>

<!-- ───────── MAIN EXPERIENCE ───────── -->
<div id="app">
  <canvas id="gl" aria-label="3D earrings viewer"></canvas>
  <div id="hotspots" class="hotspots"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-logo" id="headerLogo" role="img" aria-label="Tanishq"></span>
      <span class="brand-tag" id="brandTag"></span>
    </div>
    <button class="link" id="resetView" type="button">Reset view</button>
  </header>

  <main class="info" id="info">
    <h1 id="title" aria-live="polite"></h1>
    <p class="tagline" id="tagline" data-rv></p>
    <div class="cta" data-rv>
      <a class="btn" id="shop" href="#"></a>
    </div>
  </main>

  <p class="hint" id="hint">Drag to rotate &nbsp;·&nbsp; Tap a number to zoom into a feature</p>
  <nav class="thumbs" id="thumbs" aria-label="Designs"></nav>
</div>

<!-- ───────── INTRO VIDEO ───────── -->
<section id="intro" aria-label="Intro">
  <video id="introVideo" muted playsinline preload="auto"></video>
</section>

<!-- ───────── OUTRO VIDEO ───────── -->
<section id="outro" aria-label="Outro" aria-hidden="true">
  <video id="outroVideo" playsinline preload="auto"></video>
</section>

<!-- ───────── LOGO FORMATION ───────── -->
<section id="logoStage" aria-hidden="true">
  <canvas id="logoCanvas"></canvas>
  <img id="logoImg" alt="Tanishq">
  <p class="logo-tag" id="logoTag"></p>
  <p class="logo-load" id="logoLoad"></p>
</section>

<div id="fatal" role="alert"></div>

<script src="lib/gsap.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
